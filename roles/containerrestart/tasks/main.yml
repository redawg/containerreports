---
- include: preflight-checks.yml
- name: Restart Container
  remote_user: "{{ report_user }}"
  containers.podman.podman_container:
    name: report
    image: quay.io/samander/nginx-report-base
    state: started
    restart: true
  run_once: true
  delegate_to: "{{ container_host }}"
  tags: [rebootcontainer]
